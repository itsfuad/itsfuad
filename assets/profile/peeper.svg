<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img"><rect x="1" y="1" width="1198" height="298" rx="22" fill="#FAF7F1" stroke="#D8D0C5"/><rect x="28" y="28" width="8" height="244" rx="4" fill="#F14A24"/>
<text x="64" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.3" fill="#F14A24">FLAGSHIP / PROGRAMMING LANGUAGE</text>
<text x="64" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" fill="#181716">Peeper</text>
<text x="64" y="158" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#716B63">A programming language and compiler built around explicit semantics,</text>
<text x="64" y="182" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#716B63">readable behavior, and maintainable compiler architecture.</text>
<text x="64" y="217" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#181716">Things should work and feel the way they look.</text><rect x="64" y="238" width="58" height="28" rx="6" fill="#E7DED1"/><text x="75" y="255" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing=".7" fill="#181716">GO</text><rect x="130" y="238" width="101" height="28" rx="6" fill="#E7DED1"/><text x="141" y="255" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing=".7" fill="#181716">TYPE SYSTEM</text><rect x="239.2" y="238" width="87" height="28" rx="6" fill="#E7DED1"/><text x="250.2" y="255" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing=".7" fill="#181716">OWNERSHIP</text><rect x="334.0" y="238" width="87" height="28" rx="6" fill="#E7DED1"/><text x="345.0" y="255" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing=".7" fill="#181716">DATA FLOW</text><rect x="428.8" y="238" width="58" height="28" rx="6" fill="#E7DED1"/><text x="439.8" y="255" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing=".7" fill="#181716">LSP</text><rect x="790" y="48" width="350" height="204" rx="16" fill="#232220"/>
<text x="820" y="83" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#BEB8B0">LANGUAGE / COMPILER</text>
<text x="820" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#FFFDF9">parse - resolve - check</text>
<text x="820" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#FFFDF9">      - ownership</text>
<text x="820" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#FFFDF9">      - data-flow</text>
<text x="820" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#FFFDF9">      - tooling / LSP</text>
<rect x="820" y="224" width="55" height="4" fill="#F14A24"/>
</svg>